# Cloud Development Blueprint - DATABASE ON CLOUD (Neon / Supabase / etc.)
# Same services as local-dev but without the local primary app database.
# DATABASE_URL comes from the active host context.
# Telemetry DSNs are resolved by BreakerAmp before blueprint expansion:
# - explicit telemetry DSN from context/env when configured
# - otherwise the local telemetry-db service in this cloud-dev stack
#
# Architecture:
#   - No amprealize-db container (main database lives in the cloud)
#   - telemetry-db runs locally for development telemetry/metrics
#   - Services receive explicit container-safe DB/telemetry DSNs from BreakerAmp
#   - Redis still runs locally (low-latency cache)
#   - Main app migrations run on the host via `amprealize context migrate`
#   - Telemetry migrations run in-container against local telemetry-db
#
# Usage:
#   amprealize context use neon            # activate cloud context (sets DATABASE_URL)
#   breakeramp plan --blueprint cloud-dev --env cloud-dev
#   breakeramp apply --blueprint cloud-dev --env cloud-dev
#
# Neon / cloud Postgres performance (host context, not Podman):
#   - Prefer Neon's *pooler* connection string (often host contains "-pooler")
#     over the direct instance host to cut connection latency and churn.
#   - Append ?sslmode=require when Neon requires TLS.
#   - Podman socket bind mount: BreakerAmp sets AMPREALIZE_PODMAN_SOCK_HOST_PATH
#     before expanding blueprints (from podman machine inspect / Linux paths).
#     Override on the host if needed.
#   - Optional API pool tuning via env (see amprealize/storage/postgres_pool.py):
#       AMPREALIZE_PG_POOL_RECYCLE, AMPREALIZE_PG_CONNECT_TIMEOUT,
#       AMPREALIZE_PG_POOL_SIZE, AMPREALIZE_PG_POOL_MAX_OVERFLOW,
#       or DATABASE_POOL_SIZE / DATABASE_MAX_OVERFLOW in settings.
#   - Raising AMPREALIZE_API_WORKERS increases concurrent requests but multiplies
#     DB pool usage per worker; stay within Neon max connections.
# Podman here runs telemetry/Redis/API/console/workers; app DB round-trips are API→Neon.
#
# Port Conventions (same as local-dev):
#   Telemetry DB: 5433
#   Redis: 6379
#   API: 8000
#   Web Console: 5173

name: cloud-dev
version: 2.0.0

# =============================================================================
# MODULES
# =============================================================================
modules:
  core:
    description: "Core infrastructure (Redis only — databases are cloud-hosted)"
    enabled: true
  console:
    description: "Amprealize API + web console (local dev)"
    enabled: true
  whiteboard:
    description: "Whiteboard real-time sync sidecar for brainstorm sessions"
    enabled: true
  agents:
    description: "Agent workspace management (requires Podman API service)"
    enabled: true  # Required for queue-based execution (EXECUTION_MODE=queue)
  streaming:
    description: "Kafka streaming pipeline - optional"
    enabled: false
  monitoring:
    description: "Prometheus/Grafana monitoring - optional"
    enabled: false

# =============================================================================
# SERVICES
# =============================================================================
services:
  # ---------------------------------------------------------------------------
  # MODULE: CORE - local telemetry database + Redis
  # ---------------------------------------------------------------------------

  # --- Telemetry Database (Port 5433) - TimescaleDB ---
  # Keeps cloud-dev app data on Neon while storing dev observability locally.
  telemetry-db:
    image: docker.io/timescale/timescaledb:latest-pg16
    module: core
    ports:
      - "${AMPREALIZE_PG_PORT_TELEMETRY:-5433}:5432"
    environment:
      POSTGRES_USER: "${AMPREALIZE_PG_USER_TELEMETRY:-telemetry}"
      POSTGRES_PASSWORD: "${AMPREALIZE_PG_PASS_TELEMETRY:-telemetry_dev}"
      POSTGRES_DB: "${AMPREALIZE_PG_DB_TELEMETRY:-telemetry}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - telemetry-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U telemetry -d telemetry"]
      interval: 5s
      timeout: 3s
      retries: 5
    healthcheck_timeout_s: 30

  # --- Redis Cache ---
  redis:
    image: docker.io/library/redis:7-alpine
    module: core
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    healthcheck_timeout_s: 15

  # ---------------------------------------------------------------------------
  # MODULE: AGENTS - Queue-Based Execution Workers
  # ---------------------------------------------------------------------------

  # --- Podman Socket Proxy (TCP gateway to Podman socket) ---
  podman-socket-proxy:
    image: docker.io/alpine/socat:1.0.5
    module: agents
    privileged: true
    ports:
      - "8888:8888"
    volumes:
      # Host path set by BreakerAmp before compose (AMPREALIZE_PODMAN_SOCK_HOST_PATH)
      - "${AMPREALIZE_PODMAN_SOCK_HOST_PATH:-/run/user/501/podman/podman.sock}:/run/podman/podman.sock"
    command:
      - "tcp-listen:8888,reuseaddr,fork"
      - "unix-connect:/run/podman/podman.sock"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 8888 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    healthcheck_timeout_s: 30

  # --- Execution Worker Service (Queue Consumer) ---
  execution-worker:
    image: docker.io/library/python:3.11-slim-bookworm
    module: agents
    depends_on:
      - telemetry-db
      - redis
      - podman-socket-proxy
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}:/app"
      - "execution-worker-pip-cache:/root/.cache/pip"
    workdir: /app
    command:
      - "sh"
      - "-c"
      - "pip install -e '.[postgres]' -e ./packages/execution-queue -e ./packages/raze -e ./packages/breakeramp && python -m amprealize.execution_worker"
    environment:
      # Redis Streams connection
      REDIS_URL: "redis://redis:6379/0"
      # Consumer identity
      WORKER_ID: "${HOSTNAME:-worker-1}"
      CONSUMER_GROUP: "amprealize-workers"
      # Cloud database connections — passed through from host env vars
      DATABASE_URL: "${BREAKERAMP_CLOUD_DATABASE_URL}"
      TELEMETRY_DATABASE_URL: "${BREAKERAMP_CLOUD_TELEMETRY_DATABASE_URL}"
      AMPREALIZE_TELEMETRY_PG_DSN: "${BREAKERAMP_CLOUD_TELEMETRY_PG_DSN}"
      AMPREALIZE_METRICS_PG_DSN: "${BREAKERAMP_CLOUD_METRICS_PG_DSN}"
      AMPREALIZE_TELEMETRY_ENABLED: "${AMPREALIZE_TELEMETRY_ENABLED:-true}"
      # Podman API via socket proxy (AmpOrchestrator)
      PODMAN_HOST: "tcp://podman-socket-proxy:8888"
      # LLM Provider API Keys
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY:-}"
      # Managed observability exporter passthrough
      AMPREALIZE_DATADOG_OTLP_ENDPOINT: "${AMPREALIZE_DATADOG_OTLP_ENDPOINT:-}"
      AMPREALIZE_DATADOG_API_KEY: "${AMPREALIZE_DATADOG_API_KEY:-}"
      AMPREALIZE_LANGFUSE_PUBLIC_KEY: "${AMPREALIZE_LANGFUSE_PUBLIC_KEY:-}"
      AMPREALIZE_LANGFUSE_SECRET_KEY: "${AMPREALIZE_LANGFUSE_SECRET_KEY:-}"
      AMPREALIZE_LANGFUSE_HOST: "${AMPREALIZE_LANGFUSE_HOST:-}"
      # Worker tuning
      WORKER_HEARTBEAT_INTERVAL_S: "30"
      WORKER_CLAIM_TIMEOUT_MS: "300000"
      WORKER_MAX_RETRIES: "3"
      # Workspace provisioning
      PROVISION_WORKSPACE: "true"
      WORKSPACE_DEFAULT_IMAGE: "docker.io/library/python:3.11-slim"
      WORKSPACE_DEFAULT_MEMORY: "2g"
      WORKSPACE_DEFAULT_CPU: "2.0"
    extra_hosts:
      - "host.containers.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "grep -r execution_worker /proc/*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    healthcheck_timeout_s: 120

  # ---------------------------------------------------------------------------
  # MODULE: CONSOLE (Local API + Web Console + Gateway)
  # ---------------------------------------------------------------------------

  gateway:
    image: docker.io/library/nginx:alpine
    module: console
    ports:
      - "${GATEWAY_PORT:-8080}:80"
      - "${GATEWAY_TLS_PORT:-8443}:443"
    depends_on:
      - amprealize-api
      - web-console
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}/config/nginx/nginx.conf:/etc/nginx/templates/nginx.conf.template:ro"
      - "${AMPREALIZE_REPO_ROOT:-.}/config/nginx/docker-entrypoint.sh:/docker-entrypoint-custom.sh:ro"
    environment:
      NGINX_SSL_CERT: "${NGINX_SSL_CERT:-}"
      NGINX_SSL_KEY: "${NGINX_SSL_KEY:-}"
      NGINX_SSL_REDIRECT: "${NGINX_SSL_REDIRECT:-false}"
    command: ["/bin/sh", "/docker-entrypoint-custom.sh"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/nginx-health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    healthcheck_timeout_s: 60

  amprealize-api:
    image: "${AMPREALIZE_API_IMAGE:-docker.io/library/python:3.11-slim-bookworm}"
    module: console
    ports:
      - "${AMPREALIZE_API_PORT:-8000}:8000"
    depends_on:
      - telemetry-db
      - redis
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}:/app"
      - "amprealize-api-pip-cache:/root/.cache/pip"
    workdir: /app
    command:
      - "sh"
      - "-c"
      # Default workers=4 for cloud-dev when using pip path. With AMPREALIZE_API_SKIP_PIP=1
      # and a baked image (see deployment/Dockerfile.api-dev), uvicorn starts immediately.
      - |
        set -e
        # Default 1 worker: ConversationEventHub is in-process memory; multiple workers
        # split WebSocket subscribers from REST/reply tasks so real-time chat breaks.
        W="${AMPREALIZE_API_WORKERS:-1}"
        if [ "${AMPREALIZE_API_SKIP_PIP:-}" = "1" ]; then
          exec uvicorn amprealize.api:app --host 0.0.0.0 --port 8000 --workers "$W" --log-level info
        fi
        pip install -e '.[postgres]' -e ./packages/raze -e ./packages/breakeramp -e ./packages/execution-queue
        exec uvicorn amprealize.api:app --host 0.0.0.0 --port 8000 --workers "$W" --log-level info
    environment:
      AMPREALIZE_API_SKIP_PIP: "${AMPREALIZE_API_SKIP_PIP:-}"
      # Podman API for workspace provisioning (when using queue mode)
      PODMAN_HOST: "${PODMAN_HOST:-tcp://host.containers.internal:8888}"
      # =========================================================================
      # Cloud database connections — passed through from host env vars
      # Set via `amprealize context use <name>` before starting
      # =========================================================================
      DATABASE_URL: "${BREAKERAMP_CLOUD_DATABASE_URL}"
      TELEMETRY_DATABASE_URL: "${BREAKERAMP_CLOUD_TELEMETRY_DATABASE_URL}"
      AMPREALIZE_API_WORKERS: "${AMPREALIZE_API_WORKERS:-1}"
      AMPREALIZE_TELEMETRY_ENABLED: "${AMPREALIZE_TELEMETRY_ENABLED:-true}"
      # Explicit Org DSN — falls back to DATABASE_URL
      AMPREALIZE_ORG_PG_DSN: "${DATABASE_URL}"

      # =========================================================================
      # LEGACY: Per-service DSNs — all pass through DATABASE_URL from host
      # The dsn.py resolver chain (explicit → service env → DATABASE_URL) means
      # these are optional, but we set them for backward compatibility.
      # =========================================================================
      AMPREALIZE_AUTH_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_BOARD_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_ACTION_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_RUN_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_EXECUTION_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_WORKFLOW_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_BEHAVIOR_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_COMPLIANCE_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_AGENT_ORCHESTRATOR_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_AGENT_REGISTRY_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_MESSAGING_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_WHITEBOARD_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_METRICS_PG_DSN: "${BREAKERAMP_CLOUD_METRICS_PG_DSN}"
      AMPREALIZE_TELEMETRY_PG_DSN: "${BREAKERAMP_CLOUD_TELEMETRY_PG_DSN}"
      # Sampled REST `api.http.completed` (host `BREAKERAMP_CLOUD_TELEMETRY_PG_DSN` must match sink target). Default 1; use 0.1 if noisy.
      AMPREALIZE_API_HTTP_TELEMETRY_SAMPLE_RATE: "${AMPREALIZE_API_HTTP_TELEMETRY_SAMPLE_RATE:-1}"
      # Whiteboard storage backend — use Postgres in cloud-dev
      WHITEBOARD_STORAGE_BACKEND: "postgres"
      WHITEBOARD_PG_DSN: "${DATABASE_URL}"

      # =========================================================================
      # OAuth settings (loaded from .env.google-oauth and .env.github-oauth)
      # =========================================================================
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      OAUTH_CLIENT_ID: "${OAUTH_CLIENT_ID:-}"
      OAUTH_CLIENT_SECRET: "${OAUTH_CLIENT_SECRET:-}"

      # =========================================================================
      # GitHub App Configuration
      # =========================================================================
      GITHUB_APP_ID: "${GITHUB_APP_ID:-}"
      GITHUB_APP_SLUG: "${GITHUB_APP_SLUG:-}"
      GITHUB_APP_CLIENT_ID: "${GITHUB_APP_CLIENT_ID:-}"
      GITHUB_APP_CLIENT_SECRET: "${GITHUB_APP_CLIENT_SECRET:-}"
      GITHUB_APP_PRIVATE_KEY_PATH: "/app/secrets/${GITHUB_APP_PRIVATE_KEY_FILENAME:-github-app.pem}"
      GITHUB_APP_CALLBACK_URL: "${GITHUB_APP_CALLBACK_URL:-http://localhost:5173/auth/github-app/callback}"

      # =========================================================================
      # Application settings
      # =========================================================================
      # Enable app-level modules explicitly for dev containers.
      # BreakerAmp's infrastructure module filter (core/console/agents) does not
      # automatically populate Amprealize's modular-install config.
      AMPREALIZE_MODULES_AGENTS: "true"
      AMPREALIZE_MODULES_BEHAVIORS: "true"
      AMPREALIZE_MODULES_COLLABORATION: "true"
      AMPREALIZE_MODULES_WHITEBOARD: "true"
      AMPREALIZE_ENABLE_WHITEBOARD: "true"
      AMPREALIZE_CONSOLE_URL: "http://localhost:5173"
      AMPREALIZE_CORS_ORIGINS: "http://localhost:${AMPREALIZE_WEB_CONSOLE_PORT:-5173},http://localhost:5173,http://localhost:3000"
      AMPREALIZE_DEVICE_VERIFICATION_URI: "http://localhost:${AMPREALIZE_API_PORT:-8000}/v1/device/authorize"
      REDIS_URL: "redis://redis:6379/0"
      EXECUTION_MODE: "${EXECUTION_MODE:-queue}"

      # =========================================================================
      # LLM Provider API Keys
      # =========================================================================
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY:-}"
      # Managed observability exporter passthrough
      AMPREALIZE_DATADOG_OTLP_ENDPOINT: "${AMPREALIZE_DATADOG_OTLP_ENDPOINT:-}"
      AMPREALIZE_DATADOG_API_KEY: "${AMPREALIZE_DATADOG_API_KEY:-}"
      AMPREALIZE_LANGFUSE_PUBLIC_KEY: "${AMPREALIZE_LANGFUSE_PUBLIC_KEY:-}"
      AMPREALIZE_LANGFUSE_SECRET_KEY: "${AMPREALIZE_LANGFUSE_SECRET_KEY:-}"
      AMPREALIZE_LANGFUSE_HOST: "${AMPREALIZE_LANGFUSE_HOST:-}"
      # Do not ship a shared default Fernet key — set BYOK_ENCRYPTION_KEY on the host
      # (e.g. from `python -c "from amprealize.auth.credential_encryption import CredentialEncryptionService as C; print(C.generate_key())"`).
      BYOK_ENCRYPTION_KEY: "${BYOK_ENCRYPTION_KEY:-}"
      # Set to 1 on the host to require BYOK_ENCRYPTION_KEY (or KMS/Vault) before saving keys.
      # Default 0 matches local-dev so docker cloud-dev works without an extra Fernet key.
      AMPREALIZE_REQUIRE_BYOK_ENCRYPTION: "${AMPREALIZE_REQUIRE_BYOK_ENCRYPTION:-0}"

      # =========================================================================
      # Performance instrumentation (emits `perf ...` lines on the
      # `amprealize.perf` logger). Set to 0 to A/B test whether the log
      # emission itself is a cost.
      # =========================================================================
      AMPREALIZE_PERF_LOG: "${AMPREALIZE_PERF_LOG:-1}"

      # Research URL ingest: optional Jina Reader (host .env → API). See .env.example.
      AMPREALIZE_RESEARCH_READER_PROXY: "${AMPREALIZE_RESEARCH_READER_PROXY:-}"
      AMPREALIZE_RESEARCH_JINA_READER_BASE: "${AMPREALIZE_RESEARCH_JINA_READER_BASE:-}"
      AMPREALIZE_RESEARCH_JINA_AUTO_FALLBACK: "${AMPREALIZE_RESEARCH_JINA_AUTO_FALLBACK:-}"

      # Chat: targeted workspace fetch (Phase B). Set on host .env — forwarded here.
      AMPREALIZE_ENABLE_CHAT_WORKSPACE_TARGETED_FETCH: "${AMPREALIZE_ENABLE_CHAT_WORKSPACE_TARGETED_FETCH:-false}"
    healthcheck_timeout_s: 90
    post_start_commands:
      # Run telemetry migrations against the local telemetry-db only.
      # Main app migrations still target the active cloud context on the host.
      - command: ["sh", "-c", "while ! python -c 'import alembic' 2>/dev/null; do sleep 2; done && python -m alembic -c alembic.telemetry.ini upgrade head"]
        description: "Run Telemetry Alembic migrations (local Timescale/Postgres telemetry-db)"
        timeout_s: 300

  # --- MCP Server ---
  amprealize-mcp:
    image: docker.io/library/python:3.11-slim-bookworm
    module: console
    ports:
      - "${AMPREALIZE_MCP_PORT:-3000}:3000"
    depends_on:
      - telemetry-db
      - redis
    extra_hosts:
      - "host.containers.internal:host-gateway"
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}:/app"
      - "amprealize-mcp-pip-cache:/root/.cache/pip"
    workdir: /app
    command:
      - "sh"
      - "-c"
      - "pip install -e '.[postgres]' -e ./packages/raze -e ./packages/breakeramp -e ./packages/execution-queue && tail -f /dev/null | python -m amprealize.mcp_server"
    environment:
      MCP_TRANSPORT: "${MCP_TRANSPORT:-stdio}"
      MCP_IDLE_TIMEOUT: "${MCP_IDLE_TIMEOUT:-3600}"
      MCP_SHUTDOWN_TIMEOUT: "${MCP_SHUTDOWN_TIMEOUT:-30}"
      REDIS_URL: "redis://redis:6379/0"

      # Cloud database connections — passed through from host env vars
      DATABASE_URL: "${BREAKERAMP_CLOUD_DATABASE_URL}"
      TELEMETRY_DATABASE_URL: "${BREAKERAMP_CLOUD_TELEMETRY_DATABASE_URL}"
      AMPREALIZE_TELEMETRY_PG_DSN: "${BREAKERAMP_CLOUD_TELEMETRY_PG_DSN}"
      AMPREALIZE_TELEMETRY_ENABLED: "${AMPREALIZE_TELEMETRY_ENABLED:-true}"
      AMPREALIZE_MODULES_WHITEBOARD: "true"
      AMPREALIZE_ENABLE_WHITEBOARD: "true"
      AMPREALIZE_CONSOLE_URL: "http://localhost:5173"
      AMPREALIZE_BEHAVIOR_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_WORKFLOW_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_ACTION_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_RUN_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_COMPLIANCE_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_WHITEBOARD_PG_DSN: "${DATABASE_URL}"
      AMPREALIZE_METRICS_PG_DSN: "${BREAKERAMP_CLOUD_METRICS_PG_DSN}"
      AMPREALIZE_PG_DSN: "${DATABASE_URL}"

      # LLM provider keys + BYOK (must match API policy for MCP config tools)
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY:-}"
      NVIDIA_API_KEY: "${NVIDIA_API_KEY:-}"
      TOGETHER_API_KEY: "${TOGETHER_API_KEY:-}"
      GROQ_API_KEY: "${GROQ_API_KEY:-}"
      FIREWORKS_API_KEY: "${FIREWORKS_API_KEY:-}"
      # Managed observability exporter passthrough
      AMPREALIZE_DATADOG_OTLP_ENDPOINT: "${AMPREALIZE_DATADOG_OTLP_ENDPOINT:-}"
      AMPREALIZE_DATADOG_API_KEY: "${AMPREALIZE_DATADOG_API_KEY:-}"
      AMPREALIZE_LANGFUSE_PUBLIC_KEY: "${AMPREALIZE_LANGFUSE_PUBLIC_KEY:-}"
      AMPREALIZE_LANGFUSE_SECRET_KEY: "${AMPREALIZE_LANGFUSE_SECRET_KEY:-}"
      AMPREALIZE_LANGFUSE_HOST: "${AMPREALIZE_LANGFUSE_HOST:-}"
      BYOK_ENCRYPTION_KEY: "${BYOK_ENCRYPTION_KEY:-}"
      AMPREALIZE_REQUIRE_BYOK_ENCRYPTION: "${AMPREALIZE_REQUIRE_BYOK_ENCRYPTION:-0}"

      # Chat: targeted workspace fetch (Phase B). Set on host .env — forwarded here.
      AMPREALIZE_ENABLE_CHAT_WORKSPACE_TARGETED_FETCH: "${AMPREALIZE_ENABLE_CHAT_WORKSPACE_TARGETED_FETCH:-false}"
    healthcheck:
      test: ["CMD-SHELL", "grep -r amprealize.mcp_server /proc/*/cmdline >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
    healthcheck_timeout_s: 60

  web-console:
    image: docker.io/library/node:20-bullseye-slim
    module: console
    ports:
      - "${AMPREALIZE_WEB_CONSOLE_PORT:-5173}:5173"
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}/web-console:/app"
      - "${AMPREALIZE_REPO_ROOT:-.}/packages/collab-client:/app/packages/collab-client"
      - "amprealize-web-console-node-modules:/app/node_modules"
    environment:
      VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
      VITE_WHITEBOARD_SYNC_URL: "${VITE_WHITEBOARD_SYNC_URL:-http://localhost:8080}"
      AMPREALIZE_REPO_ROOT: "/app"
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "200"
    command:
      - "sh"
      - "-lc"
      - "cd /app && npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0 --port 5173"
    healthcheck_timeout_s: 180

  whiteboard-sync:
    image: docker.io/library/node:20-alpine
    module: whiteboard
    ports:
      - "3040:3040"
    depends_on:
      - amprealize-api
    volumes:
      - "${AMPREALIZE_REPO_ROOT:-.}:/app"
      - "amprealize-cloud-whiteboard-sync-node-modules:/app/packages/whiteboard-sync/node_modules"
    workdir: /app
    command:
      - "sh"
      - "-lc"
      - "cd /app/packages/whiteboard-sync && npm ci --no-audit --no-fund && npm run build && node dist/server.js"
    environment:
      SYNC_PORT: "3040"
      PYTHON_API_BASE: "http://amprealize-api:8000/api/v1"
      ROOM_IDLE_TIMEOUT_MS: "900000"
      PERSIST_INTERVAL_MS: "15000"
      WHITEBOARD_MAX_CANVAS_SIZE_BYTES: "5242880"
      WHITEBOARD_STORAGE_BACKEND: "postgres"
      WHITEBOARD_PG_DSN: "${DATABASE_URL}"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3040/healthz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    healthcheck_timeout_s: 120

  # ---------------------------------------------------------------------------
  # MODULE: STREAMING (Optional)
  # ---------------------------------------------------------------------------

  zookeeper:
    image: docker.io/confluentinc/cp-zookeeper:7.5.0
    module: streaming
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: "2181"
      ZOOKEEPER_TICK_TIME: "2000"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep -q imok || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    healthcheck_timeout_s: 30

  kafka:
    image: docker.io/confluentinc/cp-kafka:7.5.0
    module: streaming
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_EXTERNAL_PORT:-10092}:9092"
    environment:
      KAFKA_BROKER_ID: "1"
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:${KAFKA_EXTERNAL_PORT:-10092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    healthcheck_timeout_s: 120

  # ---------------------------------------------------------------------------
  # MODULE: MONITORING (Optional)
  # ---------------------------------------------------------------------------

  prometheus:
    image: docker.io/prom/prometheus:v2.47.0
    module: monitoring
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"

  grafana:
    image: docker.io/grafana/grafana:10.1.0
    module: monitoring
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin  # pragma: allowlist secret

# =============================================================================
# VOLUMES - Main database is cloud-hosted; telemetry remains local.
# =============================================================================
volumes:
  telemetry-db-data:
    name: amprealize-cloud-dev-telemetry-db
  amprealize-web-console-node-modules:
    name: amprealize-cloud-web-console-node-modules
  amprealize-api-pip-cache:
    name: amprealize-cloud-api-pip-cache
  amprealize-mcp-pip-cache:
    name: amprealize-cloud-mcp-pip-cache
  execution-worker-pip-cache:
    name: amprealize-cloud-execution-worker-pip-cache
  amprealize-cloud-whiteboard-sync-node-modules:
    name: amprealize-cloud-whiteboard-sync-node-modules
